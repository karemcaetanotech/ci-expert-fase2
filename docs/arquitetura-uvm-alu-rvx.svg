<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:18px Arial,sans-serif;fill:#475569}.group-title{font:700 21px Arial,sans-serif;fill:#1e3a8a}.box-title{font:700 20px Arial,sans-serif;fill:#0f172a}.box-text{font:16px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.label{font:700 14px Arial,sans-serif;fill:#334155}.box{stroke-width:2.5;rx:14;ry:14}.arrow{fill:none;stroke:#1d4ed8;stroke-width:3;marker-end:url(#arrowBlue)}.arrow-both{fill:none;stroke:#1d4ed8;stroke-width:3;marker-start:url(#arrowBlueStart);marker-end:url(#arrowBlue)}.tlm{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#arrowPurple)}.sample{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrowTeal)}
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker>
    <marker id="arrowBlueStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1d4ed8"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">Arquitetura do Ambiente UVM para Verificação da ALU do RVX</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Escopo inicial: operações RV32I, wrapper da ALU, scoreboard e cobertura funcional</text>
  <rect x="35" y="110" width="1530" height="680" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="60" y="145" class="group-title">uvm_test_top / rvx_alu_env</text>
  <rect x="65" y="175" width="900" height="310" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="90" y="210" class="group-title">Agente ativo da ALU</text>
  <rect class="box" x="90" y="250" width="180" height="105" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="286" text-anchor="middle" class="box-title">Sequence</text><text x="180" y="314" text-anchor="middle" class="box-text">gera alu_item</text><text x="180" y="338" text-anchor="middle" class="small">operandos + operação</text>
  <rect class="box" x="340" y="250" width="180" height="105" fill="#dbeafe" stroke="#2563eb"/><text x="430" y="286" text-anchor="middle" class="box-title">Sequencer</text><text x="430" y="314" text-anchor="middle" class="box-text">ordena transações</text>
  <rect class="box" x="590" y="250" width="180" height="105" fill="#dbeafe" stroke="#2563eb"/><text x="680" y="286" text-anchor="middle" class="box-title">Driver</text><text x="680" y="314" text-anchor="middle" class="box-text">aplica estímulos</text>
  <rect class="box" x="825" y="220" width="115" height="165" fill="#ccfbf1" stroke="#0f766e"/><text x="882" y="253" text-anchor="middle" class="box-title">alu_if</text><text x="882" y="280" text-anchor="middle" class="small">rs1_data</text><text x="882" y="302" text-anchor="middle" class="small">rs2_data</text><text x="882" y="324" text-anchor="middle" class="small">immediate</text><text x="882" y="346" text-anchor="middle" class="small">op_code</text><text x="882" y="368" text-anchor="middle" class="small">alu_output</text>
  <path class="arrow" d="M270 302 H340"/><text x="305" y="290" text-anchor="middle" class="label">start_item</text><path class="arrow" d="M520 302 H590"/><text x="555" y="290" text-anchor="middle" class="label">seq_item</text><path class="arrow" d="M770 302 H825"/><text x="797" y="290" text-anchor="middle" class="label">vif</text>
  <rect class="box" x="1040" y="180" width="465" height="305" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1272" y="218" text-anchor="middle" class="box-title">DUT  alu_wrapper</text><text x="1272" y="248" text-anchor="middle" class="box-text">Acesso isolado à ALU do rvx_core.v</text><line x1="1065" y1="268" x2="1480" y2="268" stroke="#fdba74" stroke-width="2"/>
  <text x="1080" y="300" class="label">Entradas</text><text x="1080" y="328" class="box-text">rs1_data[31:0]</text><text x="1080" y="354" class="box-text">rs2_data[31:0]</text><text x="1080" y="380" class="box-text">immediate[31:0]</text><text x="1290" y="328" class="box-text">alu_2nd_operand_source</text><text x="1290" y="354" class="box-text">alu_operation_code[3:0]</text><text x="1080" y="425" class="label">Saída</text><text x="1145" y="425" class="box-text">alu_output[31:0]</text>
  <path class="arrow-both" d="M940 302 H1040"/><text x="990" y="288" text-anchor="middle" class="label">estímulos / resultado</text>
  <rect class="box" x="90" y="550" width="240" height="120" fill="#ccfbf1" stroke="#0f766e"/><text x="210" y="590" text-anchor="middle" class="box-title">Monitor</text><text x="210" y="618" text-anchor="middle" class="box-text">amostra entradas e saída</text><text x="210" y="644" text-anchor="middle" class="small">publica alu_item observado</text>
  <rect class="box" x="460" y="535" width="270" height="150" fill="#ede9fe" stroke="#7c3aed"/><text x="595" y="575" text-anchor="middle" class="box-title">Modelo de referência RV32I</text><text x="595" y="607" text-anchor="middle" class="box-text">calcula o resultado esperado</text><text x="595" y="635" text-anchor="middle" class="small">ADD, SUB, AND, OR, XOR,</text><text x="595" y="658" text-anchor="middle" class="small">SLT, SLTU, SLL, SRL e SRA</text>
  <rect class="box" x="860" y="535" width="245" height="150" fill="#fef3c7" stroke="#d97706"/><text x="982" y="575" text-anchor="middle" class="box-title">Scoreboard</text><text x="982" y="607" text-anchor="middle" class="box-text">observado × esperado</text><text x="982" y="640" text-anchor="middle" class="small">PASS / FAIL</text>
  <rect class="box" x="1260" y="535" width="245" height="150" fill="#dcfce7" stroke="#16a34a"/><text x="1382" y="575" text-anchor="middle" class="box-title">Coverage Subscriber</text><text x="1382" y="607" text-anchor="middle" class="box-text">operação × operandos</text><text x="1382" y="633" text-anchor="middle" class="box-text">casos de borda</text><text x="1382" y="660" text-anchor="middle" class="small">meta mínima: 90%</text>
  <path class="sample" d="M882 385 V440 H210 V550"/><text x="520" y="430" text-anchor="middle" class="label">amostragem da interface</text><path class="tlm" d="M330 585 H460"/><text x="395" y="572" text-anchor="middle" class="label">TLM analysis</text><path class="tlm" d="M330 635 H820 V610 H860"/><text x="760" y="622" text-anchor="middle" class="label">observado</text><path class="tlm" d="M730 585 H805 V575 H860"/><text x="795" y="562" text-anchor="middle" class="label">esperado</text><path class="tlm" d="M330 660 H1195 V610 H1260"/><text x="1160" y="648" text-anchor="middle" class="label">analysis_port</text>
  <rect x="35" y="820" width="1530" height="140" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="855" class="group-title">Fluxo de verificação</text><text x="60" y="895" class="box-text">1. Sequence cria a transação → 2. Driver aplica os sinais → 3. Wrapper executa a ALU → 4. Monitor coleta o resultado</text><text x="60" y="928" class="box-text">5. Modelo RV32I calcula o esperado → 6. Scoreboard compara → 7. Coverage registra os cenários exercitados</text>
</svg>
